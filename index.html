<!doctype html>

<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Hermit — Ouroboros Cybersec Roadmap</title>
<style>
  :root{
    --bg:#2a1d12;
    --bg-2:#3a2818;
    --beige:#d8c2a0;
    --beige-soft:#b89c78;
    --beige-dim:#7a6650;
    --gold:#e3a55a;
    --gold-bright:#f4c97a;
    --gray:#5a4d40;
    --gray-2:#3f352b;
    --ink:#1a1108;
    --line:#7a5a36;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:radial-gradient(ellipse at center,#3a2818 0%,#2a1d12 60%,#1a110a 100%);color:var(--beige);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Georgia,serif;min-height:100vh;overflow-x:hidden}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

  .wrap{max-width:1100px;margin:0 auto;padding:18px 14px 60px}
  .hero{position:relative;width:100%;aspect-ratio:1/1;max-width:760px;margin:0 auto;user-select:none}
  .hermit{position:absolute;left:50%;top:-2px;transform:translate(-50%,0);font-family:"Cinzel","Trajan Pro",Georgia,serif;letter-spacing:.55em;font-size:clamp(18px,3.4vw,30px);font-weight:600;color:var(--gold-bright);text-shadow:0 0 14px rgba(244,201,122,.35),0 2px 4px #000;padding:6px 14px;z-index:5}
  .hermit::after{content:"";display:block;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin-top:6px}

  svg.ouro{width:100%;height:100%;display:block;overflow:visible}

  .node{cursor:pointer}
  .node circle.bg{fill:var(--gray-2);stroke:var(--beige-dim);stroke-width:2;transition:fill .25s,stroke .25s}
  .node.done circle.bg{fill:var(--gold);stroke:var(--gold-bright);filter:drop-shadow(0 0 8px rgba(243,201,122,.55))}
  .node text{fill:var(--beige);font-family:"Cinzel",Georgia,serif;font-weight:700;text-anchor:middle;dominant-baseline:central;font-size:18px;pointer-events:none}
  .node.done text{fill:var(--ink)}
  .node:hover circle.bg{stroke:var(--gold-bright)}
  .node .ring{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:2 4;opacity:.5}

  .label{fill:var(--beige-soft);font-family:Georgia,serif;font-size:11px;text-anchor:middle;pointer-events:none;letter-spacing:.12em;text-transform:uppercase}
  .label.dur{fill:var(--beige-dim);font-size:10px;letter-spacing:.18em}

  .legend{display:flex;justify-content:center;gap:20px;margin-top:18px;flex-wrap:wrap;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--beige-dim)}
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .dot{width:14px;height:14px;border-radius:50%;display:inline-block;border:2px solid var(--beige-dim)}
  .dot.full{background:var(--gold);border-color:var(--gold-bright);box-shadow:0 0 6px rgba(243,201,122,.5)}
  .dot.empty{background:var(--gray-2)}

  .panel{margin:30px auto 0;max-width:780px;background:linear-gradient(180deg,rgba(58,40,24,.85),rgba(42,29,18,.9));border:1px solid var(--line);border-radius:14px;padding:22px;display:none;box-shadow:0 10px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(216,194,160,.08)}
  .panel.open{display:block;animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .panel header{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px;border-bottom:1px solid var(--gray);padding-bottom:12px}
  .panel h2{margin:0;font-family:"Cinzel",Georgia,serif;color:var(--gold-bright);font-size:18px;letter-spacing:.12em}
  .panel .dur{color:var(--beige-dim);font-size:12px;letter-spacing:.18em;text-transform:uppercase;margin-top:4px}
  .toggle{appearance:none;border:1px solid var(--gold);background:transparent;color:var(--gold-bright);padding:8px 14px;border-radius:999px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;font-family:inherit;white-space:nowrap}
  .toggle.done{background:var(--gold);color:var(--ink)}

  .cat{margin-top:14px}
  .cat h3{margin:0 0 6px;font-family:"Cinzel",Georgia,serif;color:var(--beige);font-size:13px;letter-spacing:.18em;text-transform:uppercase;border-left:3px solid var(--gold);padding-left:10px}
  ul.tree{list-style:none;margin:6px 0 0;padding:0 0 0 4px}
  ul.tree ul{list-style:none;margin:4px 0 6px;padding:4px 0 4px 18px;border-left:1px dashed var(--gray)}
  ul.tree li{margin:2px 0}
  .topic{cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;color:var(--beige);font-size:14.5px;line-height:1.3;transition:background .15s}
  .topic:hover{background:rgba(216,194,160,.06)}
  .topic .arrow{display:inline-block;width:10px;color:var(--gold);transition:transform .2s;font-size:11px}
  .topic.open .arrow{transform:rotate(90deg)}
  .sub{color:var(--beige-soft);font-size:13.5px;padding:3px 0 3px 20px;position:relative;line-height:1.35}
  .sub::before{content:"›";position:absolute;left:6px;color:var(--gold);opacity:.7}
  .leaf{color:var(--beige-dim);font-size:13px;padding:2px 0 2px 20px;position:relative;line-height:1.35}
  .leaf::before{content:"·";position:absolute;left:8px;color:var(--beige-dim)}
  .hidden{display:none}

  .res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
  .res-card{background:rgba(26,17,8,.4);border:1px solid var(--gray);border-radius:10px;padding:12px}
  .res-card h4{margin:0 0 8px;color:var(--gold-bright);font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-family:"Cinzel",Georgia,serif}

  .footer{text-align:center;margin-top:30px;color:var(--beige-dim);font-size:11px;letter-spacing:.2em;text-transform:uppercase}

  @media (max-width:600px){
    .node text{font-size:15px}
    .label{font-size:10px}
    .label.dur{font-size:9px}
    .panel{padding:16px;border-radius:10px}
    .panel h2{font-size:16px}
  }
</style>
</head>

<div class="wrap">

</div>

<!-- snake body: thick gold ring -->
<circle cx="0" cy="0" r="${R}" fill="none" stroke="url(#snakeGrad)" stroke-width="48" stroke-linecap="round" filter="url(#glow)"/>
<!-- inner shadow line -->
<circle cx="0" cy="0" r="${R}" fill="none" stroke="#1a1108" stroke-width="2" opacity=".5"/>
<!-- scales -->
<g id="scales"></g>

<!-- snake head & tail meet at the top (12 o'clock = -90deg) -->
<g id="headTail"></g>

<!-- nodes group -->
<g id="nodes"></g>
`;

// Generate scale tick marks along the ring
const scales = svg.querySelector("#scales");
const N_SCALES = 72;
for(let i=0;i<N_SCALES;i++){
  const ang = (i/N_SCALES)*Math.PI*2 - Math.PI/2;
  const x1 = Math.cos(ang)*(R-22), y1 = Math.sin(ang)*(R-22);
  const x2 = Math.cos(ang)*(R+22), y2 = Math.sin(ang)*(R+22);
  const ln = document.createElementNS(NS,"line");
  ln.setAttribute("x1",x1); ln.setAttribute("y1",y1);
  ln.setAttribute("x2",x2); ln.setAttribute("y2",y2);
  ln.setAttribute("stroke","#3a2616");
  ln.setAttribute("stroke-width","1");
  ln.setAttribute("opacity",".55");
  scales.appendChild(ln);
}

// Snake head & tail meeting point (top, near the HERMIT label)
// Place head slightly to the left of top, tail slightly to the right, head biting tail
const ht = svg.querySelector("#headTail");
ht.innerHTML = `
  <!-- tail tapers (right of top) -->
  <path d="M 28,-${R} q 30,-2 50,8" fill="none" stroke="url(#snakeGrad)" stroke-width="22" stroke-linecap="round" opacity=".95"/>
  <!-- head shape (left of top) biting -->
  <g transform="translate(-30,-${R}) rotate(-15)">
    <path d="M 0,0 q 30,-22 60,-6 q 12,8 8,18 q -10,12 -34,8 q -22,-2 -34,-12 z"
          fill="url(#snakeGrad)" stroke="#1a1108" stroke-width="1.5"/>
    <!-- eye -->
    <circle cx="34" cy="-4" r="3.2" fill="#1a1108"/>
    <circle cx="34.8" cy="-5" r="1" fill="#f4c97a"/>
    <!-- fang -->
    <path d="M 28,12 l 2,8 l 2,-8 z" fill="#f4ead0"/>
  </g>
`;

/* ---------- NODES AROUND CIRCLE ---------- */
const nodesG = svg.querySelector("#nodes");
const PHASE_COUNT = PHASES.length;
// Distribute nodes around the circle, leaving the top (HERMIT/head-tail) area clearer.
// Use angles from -65deg sweeping clockwise back to -115deg (skipping the top wedge).
const startDeg = -65; // just right of top
const endDeg = 295;   // 295 = -65 + 360, full sweep but starting after top
// We'll skip a 50deg gap at top (from -115 to -65)
const usable = 360 - 50; // 310 degrees usable
PHASES.forEach((p,i)=>{
  const t = i/(PHASE_COUNT-1);
  const deg = startDeg + t*usable;
  const rad = deg * Math.PI/180;
  const x = Math.cos(rad)*R, y = Math.sin(rad)*R;
  const g = document.createElementNS(NS,"g");
  g.setAttribute("class","node"+(done.has(p.id)?" done":""));
  g.setAttribute("data-id", p.id);
  g.setAttribute("transform",`translate(${x},${y})`);
  g.innerHTML = `
    <circle class="ring" r="36"/>
    <circle class="bg" r="28"/>
    <text>${p.short}</text>
  `;
  // Label outside the ring
  const lx = Math.cos(rad)*(R+62), ly = Math.sin(rad)*(R+62);
  const lbl = document.createElementNS(NS,"text");
  lbl.setAttribute("class","label");
  lbl.setAttribute("x",lx); lbl.setAttribute("y",ly);
  // small wrap: split title into 2 lines if long
  const titleParts = p.title.replace(/^Phase [0A-F✦★]+\s*[—-]\s*/,"").split(/\s+/);
  let line1 = titleParts.slice(0,2).join(" ");
  let line2 = titleParts.slice(2).join(" ");
  if(!line2){ lbl.textContent = line1; }
  else {
    const t1 = document.createElementNS(NS,"tspan"); t1.setAttribute("x",lx); t1.setAttribute("dy","-0.2em"); t1.textContent = line1;
    const t2 = document.createElementNS(NS,"tspan"); t2.setAttribute("x",lx); t2.setAttribute("dy","1.1em"); t2.textContent = line2;
    lbl.append(t1,t2);
  }
  // Duration label
  const dx = Math.cos(rad)*(R+92), dy = Math.sin(rad)*(R+92);
  const dlbl = document.createElementNS(NS,"text");
  dlbl.setAttribute("class","label dur");
  dlbl.setAttribute("x",dx); dlbl.setAttribute("y",dy);
  dlbl.textContent = p.dur;

  g.addEventListener("click",()=>openPanel(p.id));
  nodesG.append(g, lbl, dlbl);
});

/* ---------- PANEL ---------- */
const panel = document.getElementById("panel");
function openPanel(id){
  const p = PHASES.find(x=>x.id===id); if(!p) return;
  const isDone = done.has(id);
  let html = `
    <header>
      <div>
        <h2>${p.title}</h2>
        <div class="dur">Duration: ${p.dur}</div>
      </div>
      ${p.resources? "" : `<button class="toggle ${isDone?"done":""}" id="btnToggle">${isDone?"✓ Completed":"Mark complete"}</button>`}
    </header>
  `;

  const groups = p.resources ? p.groups : p.cats;
  groups.forEach((c,ci)=>{
    html += `<div class="cat"><h3>${c.name}</h3><ul class="tree">`;
    c.topics.forEach((t,ti)=>{
      const [name, subs] = t;
      const tid = `t-${id}-${ci}-${ti}`;
      html += `<li>
        <div class="topic" data-target="${tid}">
          <span class="arrow">▶</span><span>${name}</span>
        </div>
        <ul id="${tid}" class="hidden">
          ${subs.map(s=>`<li class="sub">${s}</li>`).join("")}
        </ul>
      </li>`;
    });
    html += `</ul></div>`;
  });

  panel.innerHTML = html;
  panel.classList.add("open");
  panel.scrollIntoView({behavior:"smooth", block:"start"});

  panel.querySelectorAll(".topic").forEach(el=>{
    el.addEventListener("click",()=>{
      const t = document.getElementById(el.dataset.target);
      t.classList.toggle("hidden");
      el.classList.toggle("open");
    });
  });

  const btn = document.getElementById("btnToggle");
  if(btn){
    btn.addEventListener("click",()=>{
      if(done.has(id)){ done.delete(id); } else { done.add(id); }
      saveDone();
      // update node visual
      const node = nodesG.querySelector(`.node[data-id="${CSS.escape(id)}"]`);
      if(node) node.classList.toggle("done", done.has(id));
      // update button
      const nowDone = done.has(id);
      btn.textContent = nowDone ? "✓ Completed" : "Mark complete";
      btn.classList.toggle("done", nowDone);
    });
  }
}
</script>
</body>
</html>
